plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version '2.1.21' apply false
	id 'org.jetbrains.kotlin.plugin.spring' version '2.1.21' apply false
	id 'org.jlleitschuh.gradle.ktlint' version '14.1.0' apply false
	id 'org.springframework.boot' version '3.4.12' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'com.diffplug.spotless' version '6.25.0' apply false
}

group = 'com.miyou'
version = '0.0.1-SNAPSHOT'
description = 'Webflux Multi-Module Project'

subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'com.diffplug.spotless'

	dependencies {
		implementation platform('com.fasterxml.jackson:jackson-bom:2.18.8')
		implementation platform('io.netty:netty-bom:4.1.135.Final')
		constraints {
			implementation('org.springframework.security:spring-security-web:6.4.15')
			implementation('org.springframework.security:spring-security-core:6.4.15')
			implementation('org.springframework.security:spring-security-config:6.4.15')
			implementation('org.springframework.security:spring-security-oauth2-jose:6.4.15')
			implementation('org.springframework.security:spring-security-test:6.4.15')
		}
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	repositories {
		mavenCentral()
	}

	spotless {
		java {
			target 'src/**/*.java'
			targetExclude '**/docs/**/*.java', '**/dto/**/*.java'

			toggleOffOn()

			// 1단계: Import 정리
			importOrder('java|javax', 'lombok', 'org.springframework', '', '\\#')
			removeUnusedImports()

			// 2단계: 코드 스타일 포맷팅
			eclipse().configFile(rootProject.file('gradle/formatter/eclipse-formatter.xml'))

			// 3단계: 후처리
			trimTrailingWhitespace()
			endWithNewline()
			indentWithTabs()

			custom 'Record closing paren', { content ->
				content.replaceAll(/(?m)^(public record \w+\([^)]+)(\)\s*\{)/, '$1\n) {')
			}
		}
	}

	tasks.named('check') {
		dependsOn 'spotlessCheck'
	}
}
