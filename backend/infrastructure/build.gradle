plugins {
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.spring'
	id 'java-test-fixtures'
	id 'org.jlleitschuh.gradle.ktlint'
}

kotlin {
	jvmToolchain(21)
}

ext {
	set('springAiVersion', "1.0.0-M5")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation project(':backend:common')
	implementation project(':backend:exception')
	implementation project(':backend:domain')
	implementation project(':backend:application')

	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'
	implementation 'org.springframework.ai:spring-ai-qdrant-store-spring-boot-starter'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'io.github.oshai:kotlin-logging-jvm:7.0.3'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:mongodb:1.20.4'
	testImplementation 'org.testcontainers:testcontainers:1.20.4'
	testImplementation testFixtures(project(':backend:domain'))
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testFixturesImplementation 'org.testcontainers:testcontainers:1.20.4'
	testFixturesImplementation 'org.testcontainers:mongodb:1.20.4'
	testFixturesImplementation 'org.springframework:spring-test'
}

test {
	useJUnitPlatform {
		excludeTags 'benchmark'
	}
}

ktlint {
	version.set("1.8.0")
	verbose.set(true)
	outputToConsole.set(true)
	coloredOutput.set(true)

	reporters {
		reporter(org.jlleitschuh.gradle.ktlint.reporter.ReporterType.PLAIN)
	}
}

bootJar {
	enabled = false
}

jar {
	enabled = true
}
