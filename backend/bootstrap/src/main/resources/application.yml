spring:
  application:
    name: app-miyou
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/ragdb?directConnection=true}
      # 기본값 false — @Indexed/@CompoundIndex 애노테이션이 있어도 인덱스가 실제로
      # 생성되지 않는다 (예: UserCreditDocument.userId 유니크 인덱스, 새로 추가한
      # OAuthAccountDocument의 (provider, providerUserId) 복합 유니크 인덱스). 켜지
      # 않으면 동시 로그인 레이스에서 같은 계정이 중복 생성될 수 있어 명시적으로 켠다.
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:user_memories}
server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

web:
  cors:
    # 서비스의 기본은 Nginx 단일 오리진만 허용하도록 의도됨. 기본값은 비움.
    # 프론트-백엔드 분리 배포 시에는 WEB_CORS_ALLOWED_ORIGINS를 지정한다.
    allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:}

# spring.security.oauth2.client.registration.* 는 일부러 안 씀 — Boot의
# OAuth2ClientProperties가 이 네임스페이스 아래 선언된 모든 registration의
# client-id를 무조건 non-blank로 검증해서(우리 자체 ReactiveClientRegistrationRepository
# 빈으로 Boot의 auto-wiring 경로를 안 타도 이 검증만은 항상 실행됨), provider
# 미설정 상태를 표현할 수 없다. 그래서 커스텀 프리픽스를 쓴다.
app:
  oauth2:
    redirect-base-uri: ${OAUTH2_REDIRECT_BASE_URI:http://localhost:8081}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}

jwt:
  secret: ${JWT_SECRET:}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  issuer: miyou-app

rag:
  dialogue:
    supertone:
      endpoints:
        - id: endpoint-1
          api-key: ${SUPERTONE_API_KEY_1:${SUPERTONE_API_KEY:}}
          base-url: ${SUPERTONE_BASE_URL:https://supertoneapi.com}
          max-concurrent-requests: ${SUPERTONE_MAX_CONCURRENT_1:10}
        - id: endpoint-2
          api-key: ${SUPERTONE_API_KEY_2:${SUPERTONE_API_KEY:}}
          base-url: ${SUPERTONE_BASE_URL:https://supertoneapi.com}
          max-concurrent-requests: ${SUPERTONE_MAX_CONCURRENT_2:10}
        - id: endpoint-3
          api-key: ${SUPERTONE_API_KEY_3:${SUPERTONE_API_KEY:}}
          base-url: ${SUPERTONE_BASE_URL:https://supertoneapi.com}
          max-concurrent-requests: ${SUPERTONE_MAX_CONCURRENT_3:10}
        - id: endpoint-4
          api-key: ${SUPERTONE_API_KEY_4:${SUPERTONE_API_KEY:}}
          base-url: ${SUPERTONE_BASE_URL:https://supertoneapi.com}
          max-concurrent-requests: ${SUPERTONE_MAX_CONCURRENT_4:10}
        - id: endpoint-5
          api-key: ${SUPERTONE_API_KEY_5:${SUPERTONE_API_KEY:}}
          base-url: ${SUPERTONE_BASE_URL:https://supertoneapi.com}
          max-concurrent-requests: ${SUPERTONE_MAX_CONCURRENT_5:10}
      voice-id: 2c5f135cb33f49a2c8882d
      language: ko
      style: neutral
      output-format: ${SUPERTONE_OUTPUT_FORMAT:mp3}
      voice-settings:
        pitch-shift: 0
        pitch-variance: 1.0
        speed: 1.1
      credit-monitor:
        enabled: ${SUPERTONE_CREDIT_MONITOR_ENABLED:false}
        poll-interval-seconds: ${SUPERTONE_CREDIT_POLL_INTERVAL:45}
        low-credit-threshold: ${SUPERTONE_LOW_CREDIT_THRESHOLD:10.0}
      circuit-breaker:
        base-backoff-seconds: 5
        max-backoff-seconds: 300
    personas:
      maid:
        voice-id: ${SUPERTONE_VOICE_ID_MAID:2c5f135cb33f49a2c8882d}
        language: ko
        style: neutral
        voice-settings:
          pitch-shift: 0
          pitch-variance: 1.0
          speed: 1.1
      interviewer:
        voice-id: ${SUPERTONE_VOICE_ID_INTERVIEWER:4653d63d07d5340656b6bc}
        language: ko
        style: neutral
        voice-settings:
          pitch-shift: 0
          pitch-variance: 1.0
          speed: 1.0
    stt:
      model: ${OPENAI_STT_MODEL:whisper-1}
      language: ${OPENAI_STT_LANGUAGE:ko}
      max-file-size-bytes: ${OPENAI_STT_MAX_FILE_SIZE_BYTES:26214400}
    qdrant:
      url: ${QDRANT_URL:http://localhost:6334}
      api-key: ${QDRANT_API_KEY:}
      vector-dimension: 1536
      collection-name: user_memories
    memory:
      embedding-model: text-embedding-3-small
      extraction-model: gpt-4o-mini
      conversation-threshold: 5
      importance-boost: 0.05
      importance-threshold: 0.3
    cache:
      max-history-size: ${DIALOGUE_CACHE_MAX_HISTORY_SIZE:20}
      ttl-hours: ${DIALOGUE_CACHE_TTL_HOURS:24}

credit:
  conversation-cost: ${CREDIT_CONVERSATION_COST:100}
  signup-bonus: ${CREDIT_SIGNUP_BONUS:5000}

monitoring:
  persistent:
    enabled: ${MONITORING_PERSISTENT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

