server {
    listen 80;
    server_name miyou.kr api.miyou.kr;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $app_upstream app_blue:8081;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 배포 스크립트/내부 모니터링 호환을 위해 HTTP 헬스 체크는 유지. actuator는
    # app.api.prefix(ApiPathPrefixConfiguration - @RestController만 대상) 영향을
    # 안 받으므로 경로는 그대로 둔다. 변수+정적경로 proxy_pass는 쿼리스트링을
    # 유실하므로 $is_args$args를 명시한다.
    location /actuator/health {
        proxy_pass http://$app_upstream/actuator/health$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/prometheus {
        allow 127.0.0.1;
        allow 172.31.44.177;
        deny all;

        proxy_pass http://$app_upstream/actuator/prometheus$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name miyou.kr api.miyou.kr;

    ssl_certificate /etc/letsencrypt/live/miyou.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyou.kr/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $app_upstream app_blue:8081;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /actuator/health {
        proxy_pass http://$app_upstream/actuator/health$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/monitoring {
        return 301 /admin/monitoring/;
    }

    location /admin/monitoring/ {
        auth_basic "MIYOU Monitoring";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    }

    location = /admin/monitoring/grafana {
        return 301 /admin/monitoring/grafana/;
    }

    location /admin/monitoring/grafana/ {
        auth_basic "MIYOU Monitoring";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://172.31.44.177:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /admin/monitoring/prometheus {
        return 301 /admin/monitoring/prometheus/;
    }

    location /admin/monitoring/prometheus/ {
        auth_basic "MIYOU Monitoring";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://172.31.44.177:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin/monitoring/prometheus;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /admin/monitoring/loki/ready {
        auth_basic "MIYOU Monitoring";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://172.31.44.177:3100/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/prometheus {
        allow 127.0.0.1;
        allow 172.31.44.177;
        deny all;

        proxy_pass http://$app_upstream/actuator/prometheus$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 오디오/텍스트 스트리밍(SSE)은 버퍼링을 꺼야 하므로 일반 /api/v1/ 매핑보다
    # 먼저 매치되어야 한다 - 아래 /api/v1/ 블록에 ^~ 를 안 준 이유가 이거다
    # (nginx는 접두사에 ^~ 가 없으면 정규식 location도 계속 검사한다).
    location ~ ^/api/v1/rag/dialogue/(audio|text|stt|stt/text)$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /rag/dialogue/session 등 나머지 rag/dialogue 경로도 스트리밍 엔드포인트와
    # 동일하게 와일드카드 CORS를 유지한다 (기존 /rag/ 블록과 동일 범위).
    location /api/v1/rag/dialogue/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 그 외 /api/v1/** (credit/missions/auth/metrics/oauth2 등)은 nginx에서 CORS를
    # 따로 안 넣는다 - Spring의 WebFluxCorsConfiguration(허용 오리진 화이트리스트)만 탄다.
    location /api/v1/ {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
